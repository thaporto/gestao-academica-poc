<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Gestão Acadêmica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="tela-login">
    <section class="lado-lousa">
      <h1>Gestão Acadêmica</h1>
      <p>Cadastro de alunos e matrículas em um só lugar, sem planilhas espalhadas.</p>
    </section>

    <section class="lado-form">
      <form id="form-login" novalidate>
        <h2>Entrar no sistema</h2>
        <p class="aviso erro" id="aviso" role="alert"></p>

        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
        </div>

        <button class="botao largo" type="submit">Entrar</button>

        <p class="credenciais-demo">
          Acesso de demonstração: secretaria@escola.edu.br / senac123
        </p>
      </form>
    </section>
  </div>

  <script src="js/comum.js"></script>
  <script>
    const form = document.getElementById("form-login");
    const aviso = document.getElementById("aviso");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      aviso.textContent = "";
      const botao = form.querySelector("button");
      botao.disabled = true;

      try {
        await api("/api/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            senha: document.getElementById("senha").value,
          }),
        });
        window.location.href = "matricula.html";
      } catch (erro) {
        aviso.textContent = erro.message;
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
